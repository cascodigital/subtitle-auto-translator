services:
  libretranslate:
    container_name: libretranslate
    labels:
      - "keep=true"
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "15000:5000"
    environment:
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,pt
      - LT_THREADS=4
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - legendas_network

  legendas:
    container_name: legendas
    labels:
      - "keep=true"
    build: .
    image: subtitle-auto-translator:latest
    depends_on:
      libretranslate:
        condition: service_healthy
    volumes:
      - .:/app
      - /path/to/movies:/movies
      - /path/to/tv:/tv
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - TRANSLATE_API_URL=http://libretranslate:5000/translate
      - GEMINI_MODEL=gemini-2.5-flash-lite
      - GEMINI_MAX_CHARS=2500
      - GEMINI_TIMEOUT=180
      - GEMINI_RETRIES=3
      - PROCESS_EXISTING_SOURCE_ONLY=0
    working_dir: /app
    command: ["python", "/app/translate_subtitles.py"]
    networks:
      - legendas_network

volumes:
  libretranslate_data:

networks:
  legendas_network:
    driver: bridge
